# =============================================================================
# FACTS — timestamped claims about the world. This is the heart of the wiki.
#
# A fact is "believed/known" during [established_at, revoked_at). It is MISSING
# from the wiki before established_at, and treated as a *previous understanding*
# after revoked_at.
#
# Fields:
#   id            slug, unique (prefix "f-" by convention)
#   statement     the claim, written as the understanding held at established_at
#   entities      ids of entities this fact is "about" (links the graph)
#   established_at  chapter (1-based) where this understanding first holds
#   certainty     epistemic status: fact | inference | hypothesis | speculation
#   sources       list of { chapter, quote } — always cite; chapter is required
#   refines       [optional] ids of facts this fact *extends/clarifies* without
#                 contradicting. The older fact stays true and gains a
#                 "refined by" pointer.
#   supersedes    [optional] ids of facts this fact *overturns/replaces*. The
#                 older fact becomes a past understanding, with revoked_at set
#                 to this fact's established_at.
#
# Rule: author only the FORWARD pointer (refines / supersedes) on the newer
# fact. build.py resolves the reverse direction (refined_by / superseded_by /
# revoked_at). Never set revoked_at by hand.
#
# Spoiler discipline: never write a fact that mentions knowledge from a later
# chapter than established_at. The reveal on the transmigration (same-world /
# future) is deliberately NOT in scope here — it lands far later and will be
# authored as a supersedes of f-transmigration when we reach it.
# =============================================================================

