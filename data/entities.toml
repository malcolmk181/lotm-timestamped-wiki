# =============================================================================
# ENTITIES — the stable "things" of the world (people, places, orgs, concepts).
#
# Each entity is a node. It only becomes visible on the wiki once the reader
# reaches `first_seen` (the chapter where it first appears / is introduced).
#
# Fields:
#   id         slug, unique across the whole corpus (never changes)
#   name       canonical display name
#   type       one of: character, location, organization, deity, concept,
#              language, item, ritual, currency (small controlled vocab,
#              extend deliberately rather than ad hoc)
#   first_seen chapter (1-based) where this thing is first knowable to the reader
#   aliases    other names the reader might search (static; name *changes* over
#              time belong in facts, not here)
#   summary    optional one-liner, shown on the wiki
# =============================================================================

