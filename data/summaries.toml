]

[[summaries]]
id = "s-klein-moretti-2"
entity = "klein-moretti"
established_at = 2
supersedes = ["s-klein-moretti-1"]
text = """Klein Moretti is a recent history graduate from Khoy University and a citizen of Tingen City in the Loen Kingdom, whose body has been inhabited by the transmigrator Zhou Mingrui. He is the son of a deceased Imperial Army sergeant and a mother who was a devotee of the Evernight Goddess, and he lives with his elder brother Benson and younger sister Melissa in a modest two-bedroom apartment. Upon waking, Klein is found with a severe, rapidly healing wound on his temple and blood on his hand, leading Zhou Mingrui to deduce that the original Klein died by suicide with a revolver."""
sources = [
  { chapter = 2 },
]

[[summaries]]
id = "s-klein-moretti-3"
entity = "klein-moretti"
established_at = 3
supersedes = ["s-klein-moretti-2"]
text = """Klein Moretti is a recent graduate from the Department of History at Khoy University and a citizen of the Loen Kingdom, who has been transmigrated into by Zhou Mingrui. He is the son of a deceased Imperial Army sergeant and a devotee of the Evernight Goddess, living with his elder brother Benson and younger sister Melissa in a modest household. Klein recently survived a self-inflicted gunshot wound to the temple, which has since healed completely, and he is scheduled to interview for a position at Tingen University."""
sources = [
  { chapter = 3 },
]

[[summaries]]
id = "s-klein-moretti-4"
entity = "klein-moretti"
established_at = 11
supersedes = ["s-klein-moretti-3"]
text = """Klein Moretti is a recent history graduate from Khoy University and a citizen of Tingen, who has been transmigrated into the body of his deceased self, who died by suicide with a revolver. His memories are fragmented, leaving gaps regarding the cause of death and recent events, though he recalls his family, his studies in ancient Feysac, and his mentor's recommendation letters. He has recently undergone a ritual that left four black dots on his hand and has been questioned by police, who believe he suffered amnesia and have restricted his movement."""
sources = [
  { chapter = 11 },
]

[[summaries]]
id = "s-klein-moretti-5"
entity = "klein-moretti"
established_at = 12
supersedes = ["s-klein-moretti-4"]
text = """Klein Moretti is a recent history graduate from Khoy University who has transmigrated into the body of his namesake, a citizen of Tingen in the Loen Kingdom. He is currently the prime suspect in the deaths of Welch McGovern and Naya, having woken up with a healed temple wound and fragmented memories of a suicide attempt involving a brass revolver. Klein is now navigating police scrutiny while attempting to uncover the truth behind the mysterious events and his own altered state, including the appearance of four black dots on his hand."""
sources = [
  { chapter = 12 },
]

[[summaries]]
id = "s-klein-moretti-6"
entity = "klein-moretti"
established_at = 21
supersedes = ["s-klein-moretti-5"]
text = """Klein Moretti is a citizen of the Loen Kingdom and a recent graduate of Khoy University's History department who has been transmigrated into the body of his namesake. He is currently employed as a civilian staff member for the Nighthawks, a role he accepted to gain access to mystical resources and cover his secret activities as 'The Fool'. His duties include investigating the hidden Antigonus diary and studying ancient texts, while he navigates the aftermath of the Welch incident and his own mysterious survival."""
