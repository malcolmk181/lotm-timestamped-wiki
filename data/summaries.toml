# ---- klein-moretti ------------------------------------------------------------

[[summaries]]
id = "s-klein-moretti-1"
entity = "klein-moretti"
established_at = 1
text = """Klein Moretti is a recent graduate from the Department of History at Khoy University and a citizen of the City of Tingen, who has been inhabited by the transmigrated soul of Zhou Mingrui. He wakes up in a room illuminated by a crimson moon, suffering from a grotesque wound on his temple and blood on his right hand, with a notebook on his desk containing a grim message in Hermes language."""
