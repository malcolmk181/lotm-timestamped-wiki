# =============================================================================
# SUMMARIES — prose descriptions of entities, timestamped like facts.
#
# A summary is the "readable paragraph" version of an entity's knowledge. It is
# every bit as chapter-bounded as a fact: it appears only at established_at,
# and when the understanding changes a NEW summary supersedes the old one, so
# the slider can show "what we believed this entity to be" at any chapter.
#
# Fields:
#   id            slug, unique (convention "s-<entity>-<n>")
#   entity        id of the entity this summarizes
#   established_at  chapter (1-based) where this version first holds
#   text          prose (one or more paragraphs) — write naturally, for reading
#   supersedes    [optional] ids of earlier summary versions this one replaces
#   sources       list of { chapter, quote? } backing the summary
#
# Rule (as with facts): author only the forward `supersedes` pointer on the
# NEWER version. build.py derives revoked_at / superseded_by on the old one.
# A summary may only state what is knowable by its own established_at.
# =============================================================================

